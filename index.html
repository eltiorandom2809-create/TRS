<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editor de documentos</title>
<style>
:root{color-scheme:dark;--bg:#1b1d22;--bar:#101216;--line:#2c3038;--text:#eef1f5;--muted:#9aa3b2;--blue:#3b82f6}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif;display:flex;flex-direction:column}
header{background:var(--bar);border-bottom:1px solid var(--line);padding:8px 10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.brand{font-weight:700;margin-right:8px}
button{background:#1f242d;color:var(--text);border:1px solid #39404c;border-radius:8px;padding:7px 11px;font:inherit;cursor:pointer;touch-action:manipulation}
button:hover{background:#262c37}
button.primary{background:var(--blue);border-color:var(--blue)}
button:disabled{opacity:.4;cursor:not-allowed}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.pager{display:flex;align-items:center;gap:6px}
#status{margin-left:auto;color:var(--muted);font-size:13px;max-width:100%}
#status.error{color:#fca5a5}
#progress{flex-basis:100%;height:3px;background:#263247;display:none;border-radius:4px;overflow:hidden}
#progress i{display:block;height:100%;width:0;background:var(--blue)}
main{flex:1;overflow:auto;padding:18px;display:flex}
#empty{margin:auto;text-align:center;color:var(--muted);max-width:480px}
#empty h2{color:var(--text);font-size:20px;margin:0 0 8px}
#empty .row{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
#stage{position:relative;background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.45);flex:none;margin:auto}
#view,#ov{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#ov{pointer-events:none}
#editor{position:absolute;z-index:3;outline:2px solid var(--blue);padding:0;margin:0;border:0;white-space:pre;cursor:text;overflow:visible}
.sr{position:fixed!important;width:1px!important;height:1px!important;opacity:0;pointer-events:none}
@media(max-width:600px){header{padding:6px}#status{margin-left:0;flex-basis:100%}main{padding:8px}}
</style>
</head>
<body>
<header>
 <span class="brand">Editor de documentos</span>

 <button id="bCam">Cámara</button>

<main id="scroll">
 <div id="empty">
  <h2>Abre un PDF o una imagen</h2>

  <div class="row"><button class="primary" id="bOpen2">Elegir archivo</button><button id="bCam2">Tomar foto</button></div>
 </div>

 </div>
</main>
<input type="file" id="fOpen" class="sr" accept="application/pdf,image/jpeg,image/png,image/webp">
<input type="file" id="fCam" class="sr" accept="image/jpeg,image/png,image/webp" capture="environment">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script type="module">
import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs';

const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const D=Math.min(2,window.devicePixelRatio||1);
const FAMILY={helvetica:'Arial, Helvetica, sans-serif',times:'"Times New Roman", Times, serif',courier:'"Courier New", Courier, monospace'};
/* Ascenso y descenso aproximados de cada familia (en em), para alinear la línea base del editor */
const ASC={helvetica:0.905,times:0.891,courier:0.833}, DESC={helvetica:0.212,times:0.216,courier:0.300};
const STD={helvetica:['Helvetica','HelveticaBold','HelveticaOblique','HelveticaBoldOblique'],
           times:['TimesRoman','TimesRomanBold','TimesRomanItalic','TimesRomanBoldItalic'],
           courier:['Courier','CourierBold','CourierOblique','CourierBoldOblique']};
const mctx=document.createElement('canvas').getContext('2d');
const hex=(r,g,b)=>'#'+[r,g,b].map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('');
const hexRgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));

/* ===================== Funciones de píxeles (puras, sin DOM) ===================== */

/* Muestrea el anillo de píxeles alrededor de una caja: fondo medio, uniformidad y valores para interpolar */
function ringOf(data,W,H,bx){
 const R=3;
 const x0=clamp(Math.floor(bx.x0),0,W-1),x1=clamp(Math.ceil(bx.x1),0,W-1);
 const y0=clamp(Math.floor(bx.y0),0,H-1),y1=clamp(Math.ceil(bx.y1),0,H-1);
 const px=(x,y,c)=>data[(clamp(y,0,H-1)*W+clamp(x,0,W-1))*4+c];
 const mean=pts=>{const s=[0,0,0];for(const [x,y] of pts)for(let c=0;c<3;c++)s[c]+=px(x,y,c);return s.map(v=>v/pts.length)};
 const L=[],Rt=[],T=[],B=[],all=[];
 for(let y=y0;y<=y1;y++){
  const l=[],r=[];
  for(let k=1;k<=R;k++){l.push([x0-k,y]);r.push([x1+k,y])}
  L.push(mean(l));Rt.push(mean(r));
 }
 for(let x=x0;x<=x1;x++){
  const t=[],b=[];
  for(let k=1;k<=R;k++){t.push([x,y0-k]);b.push([x,y1+k])}
  T.push(mean(t));B.push(mean(b));
 }
 for(const arr of [L,Rt,T,B])for(const m of arr)all.push(m);
 const bg=[0,0,0];
 for(const m of all)for(let c=0;c<3;c++)bg[c]+=m[c]/all.length;
 const lum=all.map(m=>.299*m[0]+.587*m[1]+.114*m[2]);
 const mu=lum.reduce((a,b)=>a+b,0)/lum.length;
 const std=Math.sqrt(lum.reduce((a,v)=>a+(v-mu)*(v-mu),0)/lum.length);
 return {x0,y0,x1,y1,L,R:Rt,T,B,bg,std};
}

/* Interpola el fondo esperado en (x,y) a partir del anillo */
function interp(rg,x,y){
 const {x0,y0,x1,y1,L,R,T,B}=rg;
 const fw=Math.max(1,x1-x0),fh=Math.max(1,y1-y0);
 const tx=clamp((x-x0)/fw,0,1),ty=clamp((y-y0)/fh,0,1);
 const l=L[clamp(y-y0,0,L.length-1)],r=R[clamp(y-y0,0,R.length-1)];
 const t=T[clamp(x-x0,0,T.length-1)],b=B[clamp(x-x0,0,B.length-1)];
 return [0,1,2].map(c=>((1-tx)*l[c]+tx*r[c]+(1-ty)*t[c]+ty*b[c])/2);
}

/* Analiza una caja de texto: color de tinta, fondo, si el fondo es liso, y si el trazo es grueso (negrita) */
function analyzeBox(data,W,H,bx,sizePx){
 const rg=ringOf(data,W,H,bx),bg=rg.bg;
 const {x0,y0,x1,y1}=rg;
 const bw=x1-x0+1,bh=y1-y0+1;
 const dist=new Float32Array(bw*bh);let maxD=0;
 for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
  const i=(y*W+x)*4;
  const d=Math.hypot(data[i]-bg[0],data[i+1]-bg[1],data[i+2]-bg[2]);
  dist[(y-y0)*bw+(x-x0)]=d;if(d>maxD)maxD=d;
 }
 const solid=rg.std<14;
 const bgHex=hex(bg[0],bg[1],bg[2]);
 const lumBg=.299*bg[0]+.587*bg[1]+.114*bg[2];
 if(maxD<35)return {color:lumBg>128?'#111111':'#f5f5f5',bg:bgHex,solid,strokeRatio:0,bold:false};
 const thr=Math.max(35,maxD*0.5);
 /* Color: promedio del 15% de píxeles más distintos al fondo (núcleo de la tinta) */
 const idx=Array.from(dist.keys()).sort((a,b)=>dist[b]-dist[a]);
 const n=Math.max(1,Math.round(idx.length*0.15));
 let r=0,g=0,b=0;
 for(let k=0;k<n;k++){const p=idx[k],x=x0+p%bw,y=y0+Math.floor(p/bw),i=(y*W+x)*4;r+=data[i];g+=data[i+1];b+=data[i+2]}
 const color=hex(r/n,g/n,b/n);
 /* Grosor: mediana de las longitudes de trazo de tinta por fila (los trazos verticales dominan) */
 const runs=[];
 for(let y=0;y<bh;y++){
  let run=0;
  for(let x=0;x<=bw;x++){
   const on=x<bw&&dist[y*bw+x]>=thr;
   if(on)run++;
   else{if(run>0&&run<bh*0.6)runs.push(run);run=0}
  }
 }
 runs.sort((a,b)=>a-b);
 const med=runs.length?runs[runs.length>>1]:0;
 const strokeRatio=sizePx>0?med/sizePx:0;
 return {color,bg:bgHex,solid,strokeRatio,bold:sizePx>=10&&strokeRatio>=0.12};
}

function hitsItem(bx,it,m){return !(bx.x1+m<it.x||bx.x0-m>it.x+it.w||bx.y1+m<it.y||bx.y0-m>it.y+it.h)}

/* Borra un texto del buffer 'out': relleno liso si el fondo es uniforme; si es foto, clona píxeles vecinos sin texto */
function eraseItem(out,src,W,H,it,all){
 const pad=Math.max(1,Math.round(it.h*0.12));
 const bx={x0:clamp(Math.floor(it.x)-pad,0,W-1),y0:clamp(Math.floor(it.y)-pad,0,H-1),
           x1:clamp(Math.ceil(it.x+it.w)+pad,0,W-1),y1:clamp(Math.ceil(it.y+it.h)+pad,0,H-1)};
 const bw=bx.x1-bx.x0+1,bh=bx.y1-bx.y0+1;
 const rg=ringOf(src,W,H,bx);
 if(it.bgSolid){
  for(let y=bx.y0;y<=bx.y1;y++)for(let x=bx.x0;x<=bx.x1;x++){
   const i=(y*W+x)*4;out[i]=rg.bg[0];out[i+1]=rg.bg[1];out[i+2]=rg.bg[2];out[i+3]=255;
  }
  return;
 }
 const k1=bh+4,k2=bw+4;
 const cands=[[0,-k1],[0,k1],[-k2,0],[k2,0],[0,-2*k1],[0,2*k1],[-2*k2,0],[2*k2,0]];
 let pick=null;
 for(const [dx,dy] of cands){
  const s={x0:bx.x0+dx,y0:bx.y0+dy,x1:bx.x1+dx,y1:bx.y1+dy};
  if(s.x0<0||s.y0<0||s.x1>=W||s.y1>=H)continue;
  if(all.some(o=>hitsItem(s,o,3)))continue;
  pick=[dx,dy];break;
 }
 if(!pick){
  for(let y=bx.y0;y<=bx.y1;y++)for(let x=bx.x0;x<=bx.x1;x++){
   const i=(y*W+x)*4,v=interp(rg,x,y);
   out[i]=v[0];out[i+1]=v[1];out[i+2]=v[2];out[i+3]=255;
  }
  return;
 }
 const [dx,dy]=pick;
 const sr=ringOf(src,W,H,{x0:bx.x0+dx,y0:bx.y0+dy,x1:bx.x1+dx,y1:bx.y1+dy});
 for(let y=bx.y0;y<=bx.y1;y++)for(let x=bx.x0;x<=bx.x1;x++){
  const i=(y*W+x)*4,si=((y+dy)*W+(x+dx))*4;
  const tv=interp(rg,x,y),sv=interp(sr,x+dx,y+dy);
  for(let c=0;c<3;c++)out[i+c]=src[si+c]+tv[c]-sv[c];
  out[i+3]=255;
 }
}

/* ===================== Estado ===================== */
const S={kind:null,name:'',mime:'',Uw:0,Uh:0,zoom:1,s:1,items:[],editing:null,hover:null,
 orig:null,origData:null,erased:null,dirtyErase:false,worker:null,
 pdf:null,pdfBytes:null,pageNum:1,numPages:0,pages:{}};

/* ===================== Utilidades de interfaz ===================== */
function message(t,err=false){const s=$('status');s.textContent=t;s.classList.toggle('error',!!err)}
function busy(on,t){
 $('progress').style.display=on?'block':'none';
 $('progress').firstElementChild.style.width='5%';
 if(t)message(t);
}
function progress(p){$('progress').firstElementChild.style.width=Math.round(10+p*90)+'%'}
function download(blob,name){
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
const baseName=n=>(n||'documento').replace(/\.[^.]+$/,'');
function mimeOf(f){
 if(/^image\/(jpeg|png|webp)$/.test(f.type))return f.type;
 const n=(f.name||'').toLowerCase();
 if(/\.jpe?g$/.test(n))return 'image/jpeg';
 if(/\.webp$/.test(n))return 'image/webp';
 return 'image/png';
}
function pdfFamily(name){
 const n=(name||'').toLowerCase();
 if(/courier|mono|consol/.test(n))return 'courier';
 if(/sans|arial|helvet|calibri|verdana|gothic|grotesk|roboto|segoe|tahoma/.test(n))return 'helvetica';
 if(/times|georgia|garamond|serif|cambria|book|palat|minion|roman/.test(n))return 'times';
 return 'helvetica';
}
function metrics(text,fam,bold,italic,size){
 mctx.font=`${italic?'italic ':''}${bold?700:400} ${size}px ${FAMILY[fam]}`;
 const m=mctx.measureText(text.trim()?text:'Hg');
 return {asc:m.actualBoundingBoxAscent??size*0.75,desc:m.actualBoundingBoxDescent??size*0.2};
}

/* ===================== Dibujo de texto ===================== */
function drawItemText(ctx,it){
 if(!it.text)return;
 ctx.save();
 ctx.font=`${it.italic?'italic ':''}${it.bold?700:400} ${it.size}px ${FAMILY[it.family]}`;
 ctx.fillStyle=it.color;ctx.textAlign='left';ctx.textBaseline='alphabetic';
 const w=ctx.measureText(it.text).width;
 /* Si el texto nuevo es más ancho que el original, se comprime solo lo necesario (hasta 80%) */
 const sx=(it.w>0&&w>it.w*1.02)?Math.max(0.8,it.w/w):1;
 ctx.translate(it.x,it.y+it.baseOff);ctx.scale(sx,1);
 ctx.fillText(it.text,0,0);
 ctx.restore();
}

/* ===================== Imágenes ===================== */
async function openImage(file){
 const url=URL.createObjectURL(file);
 const img=new Image();
 await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error('la imagen no es válida'));img.src=url});
 const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;
 const cx=c.getContext('2d',{willReadFrequently:true});
 cx.drawImage(img,0,0);URL.revokeObjectURL(url);
 resetDoc();
 S.kind='image';S.name=file.name||'imagen';S.mime=mimeOf(file);
 S.orig=c;S.origData=cx.getImageData(0,0,c.width,c.height).data;
 S.Uw=c.width;S.Uh=c.height;S.dirtyErase=true;
 showDoc();
 await runOcr();
}
function buildImageItem(w,i){
 const b=w.bbox,bw=Math.max(1,b.x1-b.x0),bh=Math.max(1,b.y1-b.y0);
 /* Tamaño: la altura de la caja se compara con la altura real de la fuente en 100 px */
 const m=metrics(w.text,'helvetica',false,false,100);
 const ratio=(m.asc+m.desc)/100;
 const size=ratio>0?bh/ratio:bh*0.85;
 const baseOff=ratio>0?(m.asc/100)*size:size*0.8;
 const an=analyzeBox(S.origData,S.orig.width,S.orig.height,{x0:b.x0,y0:b.y0,x1:b.x1,y1:b.y1},size);
 return {id:i+1,kind:'text',text:w.text,orig:w.text,conf:w.confidence,
  x:b.x0,y:b.y0,w:bw,h:bh,size,baseOff,family:'helvetica',bold:an.bold,italic:false,
  color:an.color,bg:an.bg,bgSolid:an.solid,edited:false};
}
async function runOcr(){
 if(S.kind!=='image')return;
 if(!window.Tesseract){message('No se cargó el motor de reconocimiento. Revisa tu conexión.',true);return}
 busy(true,'Detectando texto…');
 try{
  if(!S.worker)S.worker=await Tesseract.createWorker('spa+eng',1,{logger:m=>{
   if(m.status==='recognizing text'){progress(m.progress);message('Detectando texto… '+Math.round(m.progress*100)+'%')}
  }});
  const r=await S.worker.recognize(S.orig);
  const words=(r.data.words||[]).filter(w=>w.text&&w.text.trim()&&w.confidence>10);
  S.items=words.map((w,i)=>buildImageItem(w,i));
  S.dirtyErase=true;renderAll();
  message(`Se detectaron ${S.items.length} palabras. Toca una para editarla.`);
 }catch(e){
  console.error(e);message('Error al detectar el texto. Prueba con una imagen más nítida.',true);
 }finally{busy(false)}
}
function rebuildErased(){
 const W=S.orig.width,H=S.orig.height;
 const c=document.createElement('canvas');c.width=W;c.height=H;
 const cx=c.getContext('2d');
 const out=new Uint8ClampedArray(S.origData);
 for(const it of S.items)if(it.edited)eraseItem(out,S.origData,W,H,it,S.items);
 cx.putImageData(new ImageData(out,W,H),0,0);
 S.erased=c;S.dirtyErase=false;
}
function saveImage(){
 const base=currentBase();
 const W=S.orig.width,H=S.orig.height;
 const c=document.createElement('canvas');c.width=W;c.height=H;
 const cx=c.getContext('2d');
 cx.drawImage(base,0,0);
 for(const it of S.items)if(it.edited)drawItemText(cx,it);
 const type=['image/jpeg','image/png','image/webp'].includes(S.mime)?S.mime:'image/png';
 const ext=type==='image/jpeg'?'jpg':type==='image/webp'?'webp':'png';
 c.toBlob(b=>{
  if(!b){message('No se pudo guardar la imagen.',true);return}
  download(b,`${baseName(S.name)}-editado.${ext}`);message('Imagen guardada.');
 },type,0.95);
}

/* ===================== PDF ===================== */
async function openPdf(file){
 const buf=await file.arrayBuffer();
 resetDoc();
 S.kind='pdf';S.name=file.name||'documento.pdf';S.pdfBytes=buf;
 S.pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise;
 S.numPages=S.pdf.numPages;
 showDoc();
 await gotoPage(1);
}
async function loadPdfPage(n){
 if(S.pages[n])return S.pages[n];
 const page=await S.pdf.getPage(n);
 const vp1=page.getViewport({scale:1});
 const tc=await page.getTextContent();
 const items=[];
 for(const raw of tc.items){
  const text=(raw.str||'').trim();
  if(!text)continue;
  const m=pdfjsLib.Util.transform(vp1.transform,raw.transform);
  const size=Math.hypot(m[2],m[3]);
  if(!(size>0))continue;
  const st=tc.styles[raw.fontName]||{};
  const fname=st.fontFamily||'';
  const ascR=st.ascent>0?st.ascent:0.8,descR=st.descent?Math.abs(st.descent):0.2;
  items.push({id:items.length+1,kind:'text',text,orig:text,
   x:m[4],y:m[5]-ascR*size,w:Math.abs(raw.width),h:(ascR+descR)*size,
   size,baseOff:ascR*size,family:pdfFamily(fname),
   bold:/bold|black|heavy|semibold|demi/i.test(fname),italic:/italic|oblique/i.test(fname),
   nameKnown:!!fname,color:'#111111',bg:'#ffffff',bgSolid:true,edited:false});
 }
 const pg={page,items,Uw:vp1.width,Uh:vp1.height,analyzed:false,base:null,baseKey:''};
 S.pages[n]=pg;
 return pg;
}
/* Renderiza la página a 2× y muestrea color, fondo y grosor de cada texto */
async function analyzePdfPage(pg){
 if(pg.analyzed)return;
 const A=2,vp=pg.page.getViewport({scale:A});
 const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);
 const cx=c.getContext('2d',{willReadFrequently:true});
 await pg.page.render({canvasContext:cx,viewport:vp}).promise;
 const data=cx.getImageData(0,0,c.width,c.height).data;
 for(const it of pg.items){
  const bx={x0:it.x*A,y0:it.y*A,x1:(it.x+it.w)*A,y1:(it.y+it.h)*A};
  const an=analyzeBox(data,c.width,c.height,bx,it.size*A);
  it.color=an.color;it.bg=an.bg;it.bgSolid=an.solid;
  if(!it.nameKnown)it.bold=an.bold;
 }
 pg.analyzed=true;
}
async function ensurePdfBase(){
 const pg=S.pages[S.pageNum];if(!pg)return;
 const k=S.s*D,key=k.toFixed(4);
 if(pg.baseKey===key&&pg.base)return;
 const vp=pg.page.getViewport({scale:k});
 const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);
 try{await pg.page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise}
 catch(e){console.warn(e);return}
 /* Solo se guarda si el zoom no cambió mientras se renderizaba */
 if((S.s*D).toFixed(4)!==key)return;
 pg.base=c;pg.baseKey=key;
 if(S.pages[S.pageNum]===pg)paint();
}
async function gotoPage(n){
 endEdit(true);
 S.pageNum=n;busy(true,'Leyendo página…');
 try{
  const pg=await loadPdfPage(n);
  await analyzePdfPage(pg);
  if(S.pageNum!==n)return;
  S.Uw=pg.Uw;S.Uh=pg.Uh;S.items=pg.items;S.hover=null;
  updatePager();renderAll();
  message(`Página ${n}: toca un texto para editarlo.`);
 }finally{busy(false)}
}
function updatePager(){
 $('pNum').textContent=`${S.pageNum} / ${S.numPages}`;
 $('pPrev').disabled=S.pageNum<=1;$('pNext').disabled=S.pageNum>=S.numPages;
}
function savePdf(){
 const {PDFDocument,StandardFonts,rgb}=window.PDFLib;
 return (async()=>{
  const doc=await PDFDocument.load(S.pdfBytes,{ignoreEncryption:true});
  const pages=doc.getPages();
  const fonts={};
  const getFont=async(fam,bold,italic)=>{
   const i=(bold?1:0)+(italic?2:0),key=fam+i;
   if(!fonts[key])fonts[key]=await doc.embedFont(StandardFonts[STD[fam][i]]);
   return fonts[key];
  };
  const problems=[];
  for(const [n,pg] of Object.entries(S.pages)){
   const edited=pg.items.filter(it=>it.edited);
   if(!edited.length)continue;
   const p=pages[Number(n)-1];
   if(p.getRotation().angle){problems.push(`la página ${n} está rotada`);continue}
   const cb=p.getCropBox();
   const X=x=>cb.x+x,Y=y=>cb.y+cb.height-y;
   for(const it of edited){
    try{
     const [r,g,b]=hexRgb(it.bg);
     p.drawRectangle({x:X(it.x-0.6),y:Y(it.y+it.h+0.6),width:it.w+1.2,height:it.h+1.2,color:rgb(r/255,g/255,b/255)});
     if(it.text){
      const [tr,tg,tb]=hexRgb(it.color);
      const font=await getFont(it.family,it.bold,it.italic);
      p.drawText(it.text,{x:X(it.x),y:Y(it.y+it.baseOff),size:it.size,font,color:rgb(tr/255,tg/255,tb/255)});
     }
    }catch(e){problems.push(`"${it.text}": ${e.message}`)}
   }
  }
  const out=await doc.save();
  download(new Blob([out],{type:'application/pdf'}),`${baseName(S.name)}-editado.pdf`);
  message(problems.length?'Guardado con avisos: '+problems.join('; '):'PDF guardado.',problems.length>0);
 })();
}

/* ===================== Capas de vista ===================== */
function currentBase(){
 if(S.kind==='image'){if(S.dirtyErase||!S.erased)rebuildErased();return S.erased}
 if(S.kind==='pdf'){const pg=S.pages[S.pageNum];return pg?pg.base:null}
 return null;
}
function layoutStage(){
 if(!S.Uw)return;
 const avail=Math.max(160,$('scroll').clientWidth-36);
 const fit=Math.min(1,avail/S.Uw);
 S.s=fit*S.zoom;
 const st=$('stage');
 st.style.width=(S.Uw*S.s)+'px';st.style.height=(S.Uh*S.s)+'px';
 $('zoomVal').textContent=Math.round(S.zoom*100)+'%';
}
function renderAll(){
 layoutStage();paint();
 if(S.kind==='pdf')ensurePdfBase();
}
function paint(){
 if(!S.Uw)return;
 const cv=$('view'),ov=$('ov');
 const bw=Math.round(S.Uw*S.s*D),bh=Math.round(S.Uh*S.s*D);
 if(cv.width!==bw||cv.height!==bh){cv.width=bw;cv.height=bh;ov.width=bw;ov.height=bh}
 const k=bw/S.Uw;
 const ctx=cv.getContext('2d');
 ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,bw,bh);
 const base=currentBase();
 if(base)ctx.drawImage(base,0,0,bw,bh);
 ctx.setTransform(k,0,0,k,0,0);
 ctx.imageSmoothingQuality='high';
 for(const it of S.items){
  if(!it.edited)continue;
  if(S.kind==='pdf'){ctx.fillStyle=it.bg;ctx.fillRect(it.x-0.6,it.y-0.6,it.w+1.2,it.h+1.2)}
  if(it.id!==S.editing)drawItemText(ctx,it);
 }
 const oc=ov.getContext('2d');
 oc.setTransform(1,0,0,1,0,0);oc.clearRect(0,0,bw,bh);
 oc.setTransform(k,0,0,k,0,0);oc.lineWidth=1/k;
 for(const it of S.items){
  if(it.id===S.editing)continue;
  if(it.edited){oc.strokeStyle='#22c55e';oc.setLineDash([])}
  else if(it===S.hover){oc.strokeStyle='#facc15';oc.setLineDash([])}
  else{oc.strokeStyle='rgba(96,165,250,.6)';oc.setLineDash([3/k,2/k])}
  oc.strokeRect(it.x,it.y,it.w,it.h);
 }
}
function toUnit(e){
 const r=$('view').getBoundingClientRect();
 return {x:(e.clientX-r.left)/r.width*S.Uw,y:(e.clientY-r.top)/r.height*S.Uh};
}
function hitItem(p){
 if(!p)return null;
 const m=3/(S.s||1);
 for(let i=S.items.length-1;i>=0;i--){
  const it=S.items[i];
  if(p.x>=it.x-m&&p.x<=it.x+it.w+m&&p.y>=it.y-m&&p.y<=it.y+it.h+m)return it;
 }
 return null;
}

/* ===================== Edición en el lugar ===================== */
function startEdit(it){
 S.editing=it.id;
 const ed=$('editor'),s=S.s,fam=it.family||'helvetica',F=it.size*s;
 const top=(it.y+it.baseOff)*s-ASC[fam]*F;
 ed.hidden=false;
 Object.assign(ed.style,{
  left:(it.x*s)+'px',top:top+'px',minWidth:(it.w*s+4)+'px',
  lineHeight:((ASC[fam]+DESC[fam])*F)+'px',
  fontFamily:FAMILY[fam],fontSize:F+'px',
  fontWeight:it.bold?'700':'400',fontStyle:it.italic?'italic':'normal',
  color:it.color,background:it.bg
 });
 ed.textContent=it.text;
 ed.focus();
 const r=document.createRange();r.selectNodeContents(ed);r.collapse(false);
 const sel=getSelection();sel.removeAllRanges();sel.addRange(r);
 paint();
}
function endEdit(commit){
 if(S.editing==null)return;
 const it=S.items.find(i=>i.id===S.editing);
 const ed=$('editor');
 S.editing=null;
 if(commit&&it){
  const t=ed.textContent.replace(/\s+/g,' ').trim();
  if(t!==it.text){it.text=t;it.edited=t!==it.orig;S.dirtyErase=true}
 }
 ed.hidden=true;ed.textContent='';
 paint();
}

/* ===================== Eventos ===================== */
$('stage').addEventListener('pointerdown',e=>{
 if(!S.Uw||e.button>0)return;
 const it=hitItem(toUnit(e));
 if(!it||S.editing===it.id)return;
 startEdit(it);
});
$('stage').addEventListener('pointermove',e=>{
 if(!S.Uw||e.buttons)return;
 const it=hitItem(toUnit(e));
 if(it!==S.hover){S.hover=it;paint()}
});
$('stage').addEventListener('pointerleave',()=>{if(S.hover){S.hover=null;paint()}});
/* Clic fuera del editor: guarda el texto */
document.addEventListener('pointerdown',e=>{
 if(S.editing!=null&&!$('editor').contains(e.target))endEdit(true);
},true);
const ed=$('editor');
ed.addEventListener('keydown',e=>{
 if(e.key==='Enter'){e.preventDefault();endEdit(true)}
 else if(e.key==='Escape'){e.preventDefault();endEdit(false)}
});
ed.addEventListener('paste',e=>{
 e.preventDefault();
 const t=(e.clipboardData||window.clipboardData).getData('text/plain');
 document.execCommand('insertText',false,t.replace(/\s+/g,' '));
});

function setZoom(z){
 endEdit(true);
 S.zoom=clamp(z,0.25,4);
 renderAll();
}
$('zIn').onclick=()=>setZoom(S.zoom*1.25);
$('zOut').onclick=()=>setZoom(S.zoom/1.25);
$('zFit').onclick=()=>setZoom(1);
$('scroll').addEventListener('wheel',e=>{
 if(!e.ctrlKey||!S.Uw)return;
 e.preventDefault();setZoom(S.zoom*(e.deltaY<0?1.1:0.9));
},{passive:false});
window.addEventListener('resize',()=>{if(S.Uw)renderAll()});

$('pPrev').onclick=()=>{if(S.pageNum>1)gotoPage(S.pageNum-1)};
$('pNext').onclick=()=>{if(S.pageNum<S.numPages)gotoPage(S.pageNum+1)};
$('bOcr').onclick=()=>runOcr();

function openFileDialog(input){input.value='';input.click()}
$('bOpen').onclick=$('bOpen2').onclick=()=>openFileDialog($('fOpen'));
$('bCam').onclick=$('bCam2').onclick=()=>openFileDialog($('fCam'));
async function openFile(file){
 if(!file)return;
 busy(true,'Abriendo…');
 try{
  if(file.type==='application/pdf'||/\.pdf$/i.test(file.name||'')){
   await openPdf(file);
  }else if(/^image\/(jpeg|png|webp)$/.test(file.type)||/\.(jpe?g|png|webp)$/i.test(file.name||'')){
   await openImage(file);
  }else message('Formato no compatible. Usa PDF, JPG, PNG o WEBP.',true);
 }catch(e){
  console.error(e);message('No se pudo abrir el archivo: '+e.message,true);
 }finally{busy(false)}
}
$('fOpen').addEventListener('change',e=>openFile(e.target.files[0]));
$('fCam').addEventListener('change',e=>openFile(e.target.files[0]));

async function saveCurrent(){
 if(!S.Uw)return;
 endEdit(true);
 try{
  if(S.kind==='image')saveImage();
  else await savePdf();
 }catch(e){console.error(e);message('No se pudo guardar: '+e.message,true)}
}
$('bSave').onclick=saveCurrent;
$('bClose').onclick=closeDoc;
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&S.Uw){e.preventDefault();saveCurrent()}
});

function resetDoc(){
 if(S.editing!=null)endEdit(false);
 if(S.pdf){try{S.pdf.destroy()}catch(e){}}
 Object.assign(S,{kind:null,name:'',mime:'',Uw:0,Uh:0,zoom:1,s:1,items:[],editing:null,hover:null,
  orig:null,origData:null,erased:null,dirtyErase:false,pdf:null,pdfBytes:null,pageNum:1,numPages:0,pages:{}});
}
function showDoc(){
 $('empty').hidden=true;$('stage').hidden=false;
 $('bSave').disabled=false;$('bClose').disabled=false;
 $('bOcr').hidden=S.kind!=='image';
 $('pager').hidden=S.kind!=='pdf';
 if(S.kind==='pdf')updatePager();
 renderAll();
}
function closeDoc(){
 resetDoc();
 $('stage').hidden=true;$('empty').hidden=false;
 $('bSave').disabled=true;$('bClose').disabled=true;
 $('bOcr').hidden=true;$('pager').hidden=true;
 message('');
}
</script>
</body>
</html>
